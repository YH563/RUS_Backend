# custom_control_params.yaml
# 存放 MoveIt 规划参数、服务/话题配置、变换矩阵等

/rus_sim_motion:                # 保留原节点命名空间，避免冲突
  ros__parameters:
    # 服务/话题配置
    robot_pose_topic: "/nonrt_state_data"
    end_pose_topic: "/end_pose"
    cmd_service: "motiom_cmd"
    cmd_services_list: ["pre_sacn_cmd", "generate_trajectory"]

    # 法兰到探头的变换矩阵 (注意：缺少最后一个 1.0，保持原样)
    probe_to_flange: [0.452362, 0.0830591, 0.887958, 0.00492813,
                      0.891303, -0.00774884, -0.453341, 0.00274416,
                      -0.0307735, 0.996514, -0.0775361, 0.217645,
                      0.0, 0.0, 0.0]   # 缺少1.0，现用于测试

    # ----- MoveIt 规划参数 -----
    planning_group: "fairino3_v6_group"
    base_frame: "base_link"
    end_effector_link: "wrist3_link"
    velocity_scaling_factor: 0.25
    max_step: 0.01
    jump_threshold: 0.0